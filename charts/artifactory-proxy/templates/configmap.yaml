{{- include "ap.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-mirrors
  labels:
    {{- include "ap.labels" . | nindent 4 }}
data:
  {{ include "ap.fullname" . }}-mirrors.conf: |
    {{- include "ap.mirrorsConf" . | nindent 4 }}
{{- if .Values.nginx.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ap.fullname" . }}-nginx
  labels:
    {{- include "ap.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events {
        worker_connections {{ .Values.nginx.workerConnections }};
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        log_format main '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time';
        log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
                        '"host":"$host","request":"$request","status":$status,'
                        '"bytes":$body_bytes_sent,"ua":"$http_user_agent",'
                        '"rt":$request_time,"urt":"$upstream_response_time"}';
        access_log /dev/stdout {{ .Values.nginx.logFormat }};

        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65;
        server_tokens off;
        {{- if .Values.nginx.tls.enabled }}

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        {{- end }}
        {{- with .Values.nginx.extraHttpConfig }}

        {{- . | nindent 8 }}
        {{- end }}

        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    # Catch-all: unknown hosts get 404, probes hit /healthz.
    server {
        listen {{ .Values.nginx.httpPort }} default_server;
        {{- if .Values.nginx.tls.enabled }}
        listen 8443 ssl default_server;
        {{- end }}
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            default_type text/plain;
            return 404 "unknown host $host\n";
        }
    }
{{- end }}
